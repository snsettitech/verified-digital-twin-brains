services:
  - type: web
    name: verified-digital-twin-brain-api
    runtime: python
    plan: standard
    region: oregon
    
    # Build configuration
    buildCommand: |
      echo "=== Starting Build ==="
      pip install --upgrade pip
      pip install --no-cache-dir -r backend/requirements.txt
      echo "=== Build Complete ==="
    
    # Start command with single worker to reduce memory usage
    startCommand: |
      echo "=== Starting Application ==="
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120 --log-level info
    
    # Health check configuration
    healthCheckPath: /health
    healthCheckTimeout: 120
    healthCheckInterval: 15
    
    # Wait longer before starting health checks (grace period)
    # This gives the app time to fully start up
    
    autoDeploy: true
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PIP_NO_CACHE_DIR
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://digitalbrains.vercel.app,https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      # Required secrets (set in Render dashboard)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_INDEX_MODE
        value: "integrated"
      - key: PINECONE_TEXT_FIELD
        value: "chunk_text"
      - key: DATABASE_URL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Cohere Reranking (REQUIRED for production)
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_RERANK_STRICT
        value: "true"
      - key: ENABLE_FLASHRANK
        value: "true"
      - key: COHERE_RERANK_TIMEOUT_SECONDS
        value: "5.0"
      - key: HYBRID_COHERE_WEIGHT
        value: "0.7"
      - key: SELECTIVE_RERANKING_THRESHOLD
        value: "0.75"
      - key: RERANK_CACHE_ENABLED
        value: "true"
      - key: INFERENCE_PROVIDER
        value: "openai"
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: OPENAI_JSON_MODEL
        value: "gpt-4o-mini"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: CONVERSATIONAL_REALIZER_ENABLED
        value: "false"
      # Query Rewriting for Conversational Context
      - key: QUERY_REWRITING_ENABLED
        value: "false"  # Set to "true" after testing
      # LLM Model Selection (Latest: gpt-4o, Cost-effective: gpt-4o-mini)
      - key: QUERY_REWRITING_MODEL
        value: "gpt-4o"  # Latest OpenAI model (gpt-4o, gpt-4o-mini, o1-preview, o1-mini)
      - key: QUERY_REWRITING_MAX_HISTORY
        value: "5"
      - key: QUERY_REWRITING_MIN_CONFIDENCE
        value: "0.7"
      - key: QUERY_REWRITING_TIMEOUT
        value: "3.0"
      # A/B Testing for Query Rewriting
      - key: QUERY_REWRITE_AB_TEST_ENABLED
        value: "false"
      - key: QUERY_REWRITE_ROLLOUT_PERCENT
        value: "0"  # Gradually increase: 10, 25, 50, 100
      # Deep Research Runtime Controls
      - key: NAME_ONLY_DEEP_RESEARCH_ENABLED
        value: "true"
      - key: NAME_RESEARCH_METRICS_QA_ENABLED
        value: "true"
      - key: NAME_RESEARCH_SYNTHESIS_HARDENING_ENABLED
        value: "true"
      - key: NAME_RESEARCH_SYNTHESIS_REPAIR_RETRY_ENABLED
        value: "true"
      - key: NAME_RESEARCH_IDENTITY_GATING_ENABLED
        value: "true"
      - key: SEARCH_PROVIDER
        value: "exa"
      - key: DR_PHASE_12_SUPPRESS_UNRESOLVED
        value: "true"
      - key: DR_PHASE_12_AUTO_PUBLISH
        value: "false"
      - key: OPENAI_DEEP_RESEARCH_MODEL
        value: "o3"

    # Ephemeral disk for temp files
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1

  - type: worker
    name: verified-digital-twin-brain-worker
    runtime: python
    plan: standard
    region: oregon

    buildCommand: |
      echo "=== Starting Worker Build ==="
      pip install --upgrade pip
      pip install --no-cache-dir -r backend/requirements.txt
      echo "=== Worker Build Complete ==="

    startCommand: |
      echo "=== Starting Worker ==="
      cd backend
      python worker.py

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PIP_NO_CACHE_DIR
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_INDEX_MODE
        value: "integrated"
      - key: PINECONE_TEXT_FIELD
        value: "chunk_text"
      - key: DATABASE_URL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      # Cohere Reranking (REQUIRED for worker)
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_RERANK_STRICT
        value: "true"
      - key: ENABLE_FLASHRANK
        value: "true"
      - key: INFERENCE_PROVIDER
        value: "openai"
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: OPENAI_JSON_MODEL
        value: "gpt-4o-mini"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: CONVERSATIONAL_REALIZER_ENABLED
        value: "false"
      # Query Rewriting for Conversational Context
      - key: QUERY_REWRITING_ENABLED
        value: "false"
      - key: QUERY_REWRITING_MODEL
        value: "gpt-4o"  # Latest OpenAI model
      - key: QUERY_REWRITING_MAX_HISTORY
        value: "5"
      - key: QUERY_REWRITING_MIN_CONFIDENCE
        value: "0.7"
      - key: NAME_ONLY_DEEP_RESEARCH_ENABLED
        value: "true"
      - key: NAME_RESEARCH_METRICS_QA_ENABLED
        value: "true"
      - key: NAME_RESEARCH_SYNTHESIS_HARDENING_ENABLED
        value: "true"
      - key: NAME_RESEARCH_SYNTHESIS_REPAIR_RETRY_ENABLED
        value: "true"
      - key: NAME_RESEARCH_IDENTITY_GATING_ENABLED
        value: "true"
      - key: SEARCH_PROVIDER
        value: "exa"
      - key: OPENAI_DEEP_RESEARCH_MODEL
        value: "o3"

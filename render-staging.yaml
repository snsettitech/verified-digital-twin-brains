# ============================================================================
# Render Staging Blueprint — ADK Migration
# ============================================================================
# Deploy this as a SEPARATE service from production.
# Dashboard: https://dashboard.render.com → New → Blueprint
# Point to branch: feat/adk-migration
# ============================================================================

services:
  # ---------- Staging API ----------
  - type: web
    name: personaon-api-staging
    runtime: python
    region: oregon
    plan: starter
    branch: feat/adk-migration
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ENVIRONMENT
        value: staging
      - key: DEV_MODE
        value: "false"
      - key: AGENT_RUNTIME
        value: adk
      - key: ADK_PROVIDER_PRIORITY
        value: cerebras,gemini,openai
      - key: ADK_DEFAULT_MODEL
        value: cerebras/qwen-3-235b-a22b-instruct-2507
      - key: ADK_RESEARCH_MODEL
        value: cerebras/llama3.1-8b
      - key: ADK_RESEARCH_MAX_RESULTS
        value: "3"
      - key: ADK_RESEARCH_MAX_SCRAPES
        value: "2"
      - key: ADK_RESEARCH_MAX_SOURCE_TEXT_CHARS
        value: "700"
      - key: ADK_RESEARCH_MAX_SNIPPET_CHARS
        value: "250"
      - key: ADK_RESEARCH_MAX_QUOTE_CANDIDATES
        value: "8"
      # --- Secrets (set in Render dashboard, not here) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: qwen-3-235b-a22b-instruct-2507
      - key: GOOGLE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false

  # ---------- Staging Worker ----------
  - type: worker
    name: personaon-worker-staging
    runtime: python
    region: oregon
    plan: starter
    branch: feat/adk-migration
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ENVIRONMENT
        value: staging
      - key: WORKER_MODE
        value: all
      - key: ADK_PROVIDER_PRIORITY
        value: cerebras,gemini,openai
      - key: ADK_DEFAULT_MODEL
        value: cerebras/qwen-3-235b-a22b-instruct-2507
      - key: ADK_RESEARCH_MODEL
        value: cerebras/llama3.1-8b
      # --- Same secrets as API (set in Render dashboard) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: qwen-3-235b-a22b-instruct-2507

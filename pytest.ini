[pytest]
norecursedirs =
    .git
    .venv
    node_modules
    tmp
addopts =
    --ignore=tmp
    --ignore=tmp/pr11_audit_2
    --ignore=tmp/pr11_head_audit
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    ignore:Support for class-based `config` is deprecated.*:DeprecationWarning
    ignore:`json_encoders` is deprecated.*:DeprecationWarning
    ignore:The `copy` method is deprecated.*:DeprecationWarning
    ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated.*:DeprecationWarning
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:DeprecationWarning
    ignore:on_event is deprecated.*:DeprecationWarning
    ignore:The 'timeout' parameter is deprecated.*:DeprecationWarning
    ignore:The 'verify' parameter is deprecated.*:DeprecationWarning
    ignore:It is deprecated to return a value that is not None from a test case.*:DeprecationWarning
    ignore:.*enablePackrat.*:DeprecationWarning
    ignore:.*escChar.*deprecated.*:DeprecationWarning
    ignore:.*unquoteResults.*deprecated.*:DeprecationWarning
    ignore:PyPDF2 is deprecated.*:DeprecationWarning
    ignore:'audioop' is deprecated.*:DeprecationWarning
    ignore:Couldn't find ffmpeg or avconv.*:RuntimeWarning
    ignore:coroutine '.*' was never awaited:RuntimeWarning
    ignore:unclosed transport .*:ResourceWarning
    ignore:unclosed event loop .*:ResourceWarning

name: Repo Hygiene

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  hygiene:
    name: Enforce Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on tracked files that match .gitignore
        shell: bash
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files -ci --exclude-standard || true)"
          if [[ -n "$tracked_ignored" ]]; then
            echo "Tracked files still match .gitignore patterns:"
            echo "$tracked_ignored"
            echo ""
            echo "Remove them from version control with: git rm --cached <path>"
            exit 1
          fi

      - name: Fail on committed junk outside docs/archive
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(git ls-files -- . ':(exclude)docs/archive/**')"
          forbidden="$(
            printf '%s\n' "$tracked_files" | grep -E \
              '(^|/)(artifacts|tmp|temp|proof)(/|$)|(^|/)(__pycache__|\.pytest_cache|\.model_cache)(/|$)|(^|/)(playwright-report|playwright-test-results|test-results|test-results-temp|coverage|htmlcov)(/|$)|(^|/)\.env($|\.)|(^|/).*\.(log|err\.log|out\.log)$|(^|/).*(_results|debug).*\.json$|(^|/)backend/(chunking_eval_.*\.(json|md)|system_audit_.*\.json|error_log\.txt|repro_test\.txt|test_token\.txt)$|(^|/)frontend/(lint-output\.json|playwright\.tmp\.config\.cjs)$|(^|/)frontend/tests/tmp/.*$|(^|/)deployment_success\.png$|(^|/)supabase-mcp-server-.*\.tgz$' \
              || true
          )"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden committed junk detected:"
            echo "$forbidden"
            exit 1
          fi

      - name: Warn on hardcoded local or deployment URLs in source
        shell: bash
        run: |
          set -euo pipefail
          findings="$(
            grep -RInE '(http://localhost:[0-9]+|https://[^"[:space:]]+\.onrender\.com|https://[^"[:space:]]+\.vercel\.app)' \
              backend frontend \
              --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              --exclude-dir='tests' \
              --exclude='next.config.ts' \
              --exclude='vercel.json' \
              || true
          )"
          if [[ -n "$findings" ]]; then
            echo "Hardcoded URLs detected in source. Review whether these belong in config:"
            echo "$findings" | head -20
          fi

      - name: Warn on root markdown clutter
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(README\.md|CONTRIBUTING\.md|AGENTS\.md|DEBUG_RUNBOOK\.md|REPO_MAP\.md|RUNTIME_ENTRYPOINTS\.md|UNUSED_CODE_AUDIT\.md|REPO_HYGIENE_PLAN\.md|ENV_AUDIT\.md|DEPENDENCY_AND_REFERENCE_NOTES\.md|CLEANUP_CHANGELOG\.md)$'
          root_md="$(find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | grep -Ev "$allowed" || true)"
          if [[ -n "$root_md" ]]; then
            echo "Unexpected root-level markdown files detected:"
            echo "$root_md"
            echo "Archive or relocate non-canonical reports under docs/archive/."
            exit 1
          fi
